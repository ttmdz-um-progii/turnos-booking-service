spring.application.name=booking-service
spring.config.import=optional:file:.env[.properties]

# Base propia
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema solo lo cambian las migraciones
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka de la cátedra: se conecta recién cuando se usa
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}

# El health es público: muestra solo el estado, sin detalles internos
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Los grupos liveness/readiness son para Kubernetes: acá solo agregarían su lista a la respuesta
management.endpoint.health.probes.enabled=false
